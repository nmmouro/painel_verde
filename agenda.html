<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<title>Painel Frota</title>

<style>

body{
  margin:0;
  background:#071029;
  color:white;
  font-family:Arial;
}

/* LAYOUT */
.layout{
  display:flex;
  height:100vh;
}

.sidebar{
  width:220px;
  background:#0b1c3d;
  padding:20px;
}

.sidebar h2{
  text-align:center;
}

.sidebar button{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border:none;
  background:#1e3a8a;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.conteudo{
  flex:1;
  padding:20px;
  overflow:auto;
}

/* KPIs */
.kpis{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.card{
  flex:1;
  background:#1e2f5c;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

/* FORM */
.formulario{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.formulario input, select, button{
  height:45px;
  border-radius:8px;
  border:none;
  font-size:14px;
  padding:8px;
}

.formulario button{
  background:#00c853;
  font-weight:bold;
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#2c4078;
  padding:10px;
}

td{
  padding:8px;
  text-align:center;
  border:1px solid #1e2f5c;
}
  
td[contenteditable="true"]{
  cursor:text;
}

td[contenteditable="true"]:focus{
  background:#1e3a8a;
  outline:none;
}

tr:nth-child(even){
  background:#0c1d40;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:10px;
  font-size:12px;
}

.pendente{background:#fbc02d}
.ok{background:#00c853}
.cancelado{background:#d32f2f}

</style>
</head>

<body>

<div class="layout">

<!-- MENU --><aside class="sidebar">
  <button onclick="mostrarTela('agenda')">📅 Agenda do Dia</button>
  <button onclick="mostrarTela('social')">🏥 Serviço Social</button>
</aside>

<main>

  <!-- AGENDA DO DIA -->
  <div id="telaAgenda">

  <h2 style="text-align:center;">📅 AGENDA DO DIA</h2>

  <div class="formulario">

    <input type="date" id="dataAgenda">
    <input type="time" id="horaAgenda">

    <input type="text" id="passageiroAgenda" placeholder="Passageiro">
    <input type="text" id="setorAgenda" placeholder="Setor">
    <input type="text" id="motivoAgenda" placeholder="Motivo">
    <input type="text" id="itinerarioAgenda" placeholder="Itinerário">

    <button onclick="salvarAgenda()">Salvar</button>

  </div>

  <div id="tabelaAgenda"></div>

</div>
  <!-- SERVIÇO SOCIAL -->
  <div id="telaSocial" style="display:none;">

  <h2 style="text-align:center;">🏥 AGENDA SERVIÇO SOCIAL</h2>

  <div class="formulario">

    <input type="date" id="dataSocial">

    <select id="periodoSocial">
      <option value="">Selecione o período</option>
      <option value="MANHÃ">MANHÃ</option>
      <option value="TARDE">TARDE</option>
    </select>

    <input type="text" id="passageiroSocial" placeholder="Passageiro">
    <input type="text" id="motivoSocial" placeholder="Motivo">
    <input type="text" id="itinerarioSocial" placeholder="Itinerário">

    <button onclick="salvarSocial()">Salvar</button>

  </div>

  <div id="tabelaSocial"></div>

</div>
</main>

</main>
</div>

<script>

const SHEET_ID = "14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";

const WEBAPP = "https://script.google.com/macros/s/AKfycbz46GHOE1LmtbMYxwPgXQeGKGpUMIvPGKeUvojBbQwan71ZB_qJGV5YclYDId1g6Y9kjQ/exec";

/* HELPERS */
const getCell = c => c?.f ?? c?.v ?? "";

const parse = t => JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));

function statusHTML(s){
  const map = {
    "PENDENTE":"pendente",
    "CONCLUÍDO":"ok",
    "CANCELADO":"cancelado"
  };

  return `<span class="status ${map[s]||''}">${s||""}</span>`;
}

function linhaValida(v){
  return !(
    v.every(x => String(x).trim()==="") ||
    !v[1]
  );
}

  function mostrarTela(tela){

  document.getElementById("telaAgenda").style.display =
    tela === "agenda" ? "block" : "none";

  document.getElementById("telaSocial").style.display =
    tela === "social" ? "block" : "none";
}
  
/* KPIs */
function atualizarKPIs(rows){

  const total = rows.length;

  const pessoas = new Set();

  rows.forEach(r=>{
    const v = r.c.map(getCell);
    pessoas.add(v[3]);
  });

  document.getElementById("kpis").innerHTML = `
    <div class="card">📅 ${total}</div>
    <div class="card">👤 ${pessoas.size}</div>
  `;
}

/* AGENDA */
async function carregarAgenda(){

  document.getElementById("tabelaAgenda").innerHTML = "⏳ Carregando...";

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=AGENDA DO DIA&tqx=out:json`;

  const res = await fetch(url);
  const json = parseGviz(await res.text());
  const rows = json.table.rows || [];

  let html = `
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Hora</th>
        <th>Passageiro</th>
        <th>Setor</th>
        <th>Motivo</th>
        <th>Itinerário</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
  `;

  rows.forEach(row=>{

    const v = (row.c || []).map(getCell);

    if(!v[1]) return;

    html += `
    <tr>
      <td>${v[1]}</td>
      <td>${v[2]}</td>
      <td>${v[3]}</td>
      <td>${v[4]}</td>
      <td>${v[5]}</td>
      <td>${v[6]}</td>
      <td>${statusHTML(v[7])}</td>
    </tr>`;
  });

  html += "</tbody></table>";

  document.getElementById("tabelaAgenda").innerHTML = html;
}
  
  /* SALVA AGENDA */

  async function salvarAgenda(){

  const form = new FormData();

  form.append("acao","novo");
  form.append("agenda","AGENDA DO DIA");

  form.append("data", document.getElementById("dataAgenda").value);
  form.append("hora", document.getElementById("horaAgenda").value);
  form.append("passageiro", document.getElementById("passageiroAgenda").value);
  form.append("setor", document.getElementById("setorAgenda").value);
  form.append("motivo", document.getElementById("motivoAgenda").value);
  form.append("itinerario", document.getElementById("itinerarioAgenda").value);

  await fetch(WEBAPP,{method:"POST",body:form});

  carregarAgenda();
}

/* SOCIAL */
async function carregarSocial(){

  document.getElementById("tabelaSocial").innerHTML = "⏳ Carregando...";

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent("AGENDA SERVIÇO SOCIAL")}&tqx=out:json`;

  const res = await fetch(url);
  const json = parseGviz(await res.text());
  const rows = json.table.rows || [];

  let html = `
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Período</th>
        <th>Passageiro</th>
        <th>Motivo</th>
        <th>Itinerário</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
  `;

  rows.forEach(row=>{

    const v = (row.c || []).map(getCell);

    if(!v[1]) return;

    html += `
    <tr>
      <td>${v[1]}</td>
      <td>${v[2]}</td>
      <td>${v[3]}</td>
      <td>${v[5]}</td>
      <td>${v[6]}</td>
      <td>${statusHTML(v[7])}</td>
    </tr>`;
  });

  html += "</tbody></table>";

  document.getElementById("tabelaSocial").innerHTML = html;
}

/* SALVAR SOCIAL */
async function salvarSocial(){

  const form = new FormData();

  form.append("acao","novo");
  form.append("agenda","AGENDA SERVIÇO SOCIAL");

  form.append("data", document.getElementById("dataSocial").value);
  form.append("hora", document.getElementById("periodoSocial").value);

  form.append("passageiro", document.getElementById("passageiroSocial").value);
  form.append("setor", ""); // não usa
  form.append("motivo", document.getElementById("motivoSocial").value);
  form.append("itinerario", document.getElementById("itinerarioSocial").value);

  await fetch(WEBAPP,{method:"POST",body:form});

  carregarSocial();
}
  
/* EDITAR */
  
  async function editarCampo(id, campo, valor, agenda){

  const form = new FormData();

  form.append("acao","editar_campo");
  form.append("id", id);
  form.append("campo", campo);
  form.append("valor", valor);
  form.append("agenda", agenda);

  await fetch(WEBAPP,{
    method:"POST",
    body:form
  });

  toast("Atualizado ✅");
}

function carregarTudo(){
  carregarAgenda();
  carregarSocial();
}

carregarTudo();
setInterval(carregarTudo,30000);

</script>

</body>
</html>
