<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<title>Agenda Completa</title>

<style>

body{
  background:#071029;
  color:white;
  font-family:Arial;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#2c4078;
  padding:12px;
}

td{
  padding:10px;
  text-align:center;
  border:1px solid #1e2f5c;
}

tr:nth-child(even){
  background:#0c1d40;
}

tr:nth-child(odd){
  background:#0e224d;
}

</style>

</head>

<body>

<h1>📅 AGENDA COMPLETA</h1>

<div id="tabela"></div>

<script>

  const SHEET_ID =
"14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";


  const parseGviz = txt =>

JSON.parse(
  txt.substring(
    txt.indexOf("{"),
    txt.lastIndexOf("}") + 1
  )
);

const getCell = c =>
  c?.f ?? c?.v ?? "";


  async function carregarAgenda(){

const query =
"select B,C,D,E,F,G,H";

const url =

`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +

`?sheet=${encodeURIComponent("AGENDA DO DIA")}` +

`&tq=${encodeURIComponent(query)}` +

`&tqx=out:json`;

const res =
  await fetch(url);

const json =
  parseGviz(await res.text());

const rows =
  json.table.rows || [];


  const hoje = new Date();

hoje.setHours(0,0,0,0);

const agendaFiltrada =

rows.filter(row=>{

  const v =
    (row.c || []).map(getCell);

  const data =
    String(v[0] || "");

  const partes =
    data.split("/");

  if(partes.length !== 3)
    return false;

  const dataAgenda =
    new Date(
      partes[2],
      partes[1]-1,
      partes[0]
    );

  return dataAgenda >= hoje;

});


  agendaFiltrada.sort((a,b)=>{

const va =
  (a.c || []).map(getCell);

const vb =
  (b.c || []).map(getCell);

const da =
  va[0].split("/");

const db =
  vb[0].split("/");

const dataA =
  new Date(
    da[2],
    da[1]-1,
    da[0]
  );

const dataB =
  new Date(
    db[2],
    db[1]-1,
    db[0]
  );

return dataA - dataB;

});


  let html =

`
<table>

<thead>

<tr>

<th>Data</th>
<th>Hora</th>
<th>Passageiro</th>
<th>Setor</th>
<th>Motivo</th>
<th>Itinerário</th>
<th>Status</th>

</tr>

</thead>

<tbody>
`;


  agendaFiltrada.forEach(row=>{

const v =
  (row.c || []).map(getCell);

html += `

<tr>

<td>${v[0]}</td>
<td>${v[1]}</td>
<td>${v[2]}</td>
<td>${v[3]}</td>
<td>${v[4]}</td>
<td>${v[5]}</td>
<td>${v[6]}</td>

</tr>

`;

});


  html += `
</tbody>
</table>
`;

document.getElementById(
"tabela"
).innerHTML = html;

}

carregarAgenda();

</script>

</body>
</html>
