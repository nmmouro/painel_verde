<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>
body{
  margin:0;
  background:#071029;
  color:#fff;
  font-family:Arial;
}

header{
  display:flex;
  justify-content:space-between;

main{

  gap:10px;
}

  padding:10px;
}

  table{
  border-collapse:separate;
  border-spacing:0;
}

th,td{
  border:none;
  padding:8px;
}

tbody tr:nth-child(even){
  background:#0f2147;
}

  width:100%;
  border-collapse:collapse;

th,td{
  padding:6px;

thead{
  background:#2c4078;
}

.status{
  font-weight:bold;
}

.livre{color:#00ff9c;}
.ocupado{color:#ff4d4d;}
.viagem{color:#d66bff;}
.manutencao{color:#4da6ff;}

/* ================= css logo; card h1. card h2; audio ================= */

  .header-left{
display:flex;
align-items:center;
gap:15px;
}

.header-right{
display:flex;
align-items:center;
gap:10px;
}

.logo{
height:60px;
width:auto;
}

#toggle-audio.off{
background:#dc2626;
color:white;
}

#clock{
font-size:1.4rem;
font-weight:bold;
color:#ffffff;
margin-right:15px;
letter-spacing:1px;
}

.resumo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.resumo-card{
background:#0b1a3a;
border-radius:10px;
padding:10px;
}

.resumo-card h2{

}


</style>
</head>

<body>

  <audio id="beep" preload="auto"><source src="./alerta.mp3" type="audio/mpeg"></audio>

<header>

  <img src="logo.png" class="logo" onerror="this.style.display='none'">

  </div>
  
  <h1>Painel Frota</h1>

  <div>
    <span id="clock"></span>
    <button id="toggle-audio">🔊 SOM ON</button>
    <button onclick="toggleFull()">⛶</button>
  </div>
</header>

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const WEBAPP =
"https://script.google.com/macros/s/AKfycbx0XVggEh0oXHACAMDkbD2eS-hnVw_4GDOU88A7fTsWAtzSRUatK7yKSIEfz2XI40L61A/exec";

const TABS = [
  {
    id:"veiculos", title:"VEÍCULOS", sheet:"VEÍCULOS",
    headers:[
      "TRAIL TXN1I89", "CRETA TXJ6F18", "CRETA TXJ6F19", "CRETA TXJ6F20"
    ]
  },

  {
  id:"motoristas", title:"MOTORISTAS", sheet:"MOTORISTAS",
  headers:[
    "Motorista", "Status", "Condição",    
  ]
},

  {
    id:"painel", title:"PAINEL", sheet:"LANÇAMENTOS",
    headers:[
      "Data", "Hora", "Empregado", "Veículo", "Passageiro/ Setor/ Motivo", "Itinerário", "Status"
    ]
  },

  {
    id:"agenda", title:"AGENDA DO DIA", sheet:"AGENDA DO DIA",
    headers:[
      "Data", "Hora", "Passageiro", "Setor", "Motivo", "Itinerário", "Status"
    ]
  },

  {
    id:"social", title:"AGENDA SERVIÇO SOCIAL", sheet:"AGENDA SERVIÇO SOCIAL",
    headers:[
      "Data", "Período", "Passageiro", "Motivo", "Itinerário", "Status"
    ]
  }
];

/* ================= FETCH ================= */

async function getData(tab){
  const res = await fetch(`${WEBAPP}?tab=${tab}`);
  return res.json();
}

/* ================= STATUS ================= */

const STATUS = {

  atendido:{
    icon:'<span style="color:#00ff9c">✔</span>',
    class:"status-atendido"
  },

  concluido:{
    icon:'<span style="color:#7CFC00">✔</span>',
    class:"status-concluido"
  },

  andamento:{
    icon:'<span style="color:#ffcc00">⏳</span>',
    class:"status-andamento"
  },

  cancelado:{
    icon:'<span style="color:#ff4d4d">✖</span>',
    class:"status-cancelado"
  },

  manutenção:{
    icon:'<span style="color:#ff0000">🔧</span>',
    class:"status-manutencao"
  },

   viagem:{
    icon:'<span style="color:#ff9800">✈️</span>',
    class:"status-viagem"
  }

};

  function getStatusClass(status){

  const key =
    getStatusKey(status);

  return STATUS[key]?.class || "";
}

/* 🔹 retorna ícone */
function getStatusIcon(status){

  const key =
    getStatusKey(status);

  return STATUS[key]?.icon || "";
}


  function getStatusKey(status=""){

  status = status
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

  if(status.includes("manutencao"))
    return "manutenção";

  if(status.includes("viagem"))
    return "viagem";

  if(status.includes("andamento"))
    return "andamento";

  if(status.includes("atendido"))
    return "atendido";

  if(status.includes("concluido"))
    return "concluido";

  if(status.includes("cancelado"))
    return "cancelado";

  return null;
}


/* ================= RENDER ================= */

  /* ===== veículos ===== */
  
   function renderVeiculos(rows, painelRows){

  return `
    <table>
      <thead>
        <tr>
          <th>Placa</th>
          <th>Status</th>
          <th>Odômetro</th>
          <th>Combustível</th>
        </tr>
      </thead>
      <tbody>

        ${rows.map(row => {

          const v =
            (row.c || []).map(getCell);

          return `
            <tr>
              <td>
                <strong>${v[0] || ""}</strong>
              </td>
              <td>
                ${getDisponibilidade(
    v[0],
    painelRows,
    "veiculo"
)}
              </td>
              <td>
                ${v[2] || ""} km
              </td>
              <td>
                ⛽ ${v[3] || ""}
              </td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}
 
  /* ===== motoristas ===== */

function renderMotoristas(rows, painelRows, linhaFlutuante){

  return `
    <table>
      <thead>
        <tr>
          <th>Motorista</th>
          <th>Status</th>
          <th>Condição</th>
         </tr>
      </thead>
      <tbody>
        ${rows.map(row => {

          const v =
            (row.c || []).map(getCell);

          return `
            <tr>
              <td>
                <strong>${v[0] || ""}</strong>
              </td>
              <td>
                ${getDisponibilidade(
    v[0],
    painelRows,
    "motorista"
)}
              </td>
              <td>
                ${v[2] || ""}
              </td>
            </tr>
          `;
        }).join("")}
        ${linhaFlutuante}
      </tbody>
    </table>
  `;
}

  function getDisponibilidade(nome, painelRows, tipo){

  const procurado =
    String(nome || "").trim().toUpperCase();

  for(const row of painelRows){

    const valores =
      (row.c || []).map(getCell);

    const veiculo =
      String(valores[3] || "").trim().toUpperCase();

    const motorista =
      String(valores[2] || "").trim().toUpperCase();

    const status =
      String(valores[6] || "").trim().toUpperCase();

    const encontrado =
      tipo === "veiculo"
        ? veiculo === procurado
        : motorista === procurado;

    if(!encontrado){
      continue;
    }

    // MANUTENÇÃO
    if(
      status.includes("MANUTENÇÃO") ||
      status.includes("MANUTENCAO")
    ){

      if(tipo === "veiculo"){
        return '<span class="manutencao">🔵 MANUTENÇÃO</span>';
      }

      return '<span class="livre">🟢 LIVRE</span>';
    }

    // VIAGEM
    if(status.includes("VIAGEM")){
      return '<span class="viagem">🟣 VIAGEM</span>';
    }

    // OCUPADO
    return '<span class="ocupado">🔴 OCUPADO</span>';
  }

  return '<span class="livre">🟢 LIVRE</span>';
} 
   
  
  
   /* ===== painel ===== */
  
  function renderTable(headers, rows){

  if(!data.length) return "<p>Sem dados</p>";

  const headers = Object.keys(data[0]);

  return `
  <table>
    <thead>
      <tr>
        ${headers.map(h=>`<th>${h}</th>`).join("")}
      </tr>
    </thead>

    <tbody>
      ${data.map(row=>{

        const values = Object.values(row);

        const status =
          String(values.at(-1) || "");

        return `
          <tr>
            ${values.map((v,i)=>{

              const isLast =
                i === values.length-1;

              return `
                <td class="${isLast ? getStatusClass(status):""}">
                  ${v}
                </td>
              `;
            }).join("")}
          </tr>
        `;

      }).join("")}
    </tbody>
  </table>
  `;
}

/* ================= LOAD ================= */

let lastHash = "";
let firstLoad = true;

async function loadAll(){

  const app = document.getElementById("app");

  try{

    // 🔄 carregar todas as abas via WebApp
    const results = await Promise.all(
      TABS.map(t => getData(t.id))
    );

    // 🔔 DETECTA MUDANÇA
    const hash = JSON.stringify(results);

    if(!firstLoad && hash !== lastHash){
      playBeep();
    }

    firstLoad = false;
    lastHash = hash;

    app.innerHTML = "";

    /* ================= FILTROS ================= */

    const hoje = new Date().toLocaleDateString("pt-BR");

    const painelIndex =
      TABS.findIndex(t => t.id === "painel");

    const agendaIndex =
      TABS.findIndex(t => t.id === "agenda");

    const socialIndex =
      TABS.findIndex(t => t.id === "social");

    const veiculosIndex =
      TABS.findIndex(t => t.id === "veiculos");

    const motoristasIndex =
      TABS.findIndex(t => t.id === "motoristas");

    const painelRows =
      (results[painelIndex] || [])
        .filter(row => {

          const status =
            String(row["Status"] || "")
              .toUpperCase();

          return (
            status.includes("ANDAMENTO") ||
            status.includes("VIAGEM") ||
            status.includes("MANUT")
          );
        });

    const agendaRows =
      (results[agendaIndex] || [])
        .filter(row =>
          String(row["Data"] || "").trim() === hoje
        );

    const socialRows =
      (results[socialIndex] || [])
        .filter(row =>
          String(row["Data"] || "").trim() === hoje
        );

    const motoristasRows =
      results[motoristasIndex] || [];

    /* ================= MOTORISTA FLUTUANTE ================= */

    const motoristaFlutuante =
      painelRows.find(p => {

        const nome =
          String(p["Empregado"] || "").trim();

        return !motoristasRows.some(m =>
          String(m["Motorista"] || "")
          .trim() === nome
        );
      });

    let linhaFlutuante = "";

    if(motoristaFlutuante){

      const nome =
        motoristaFlutuante["Empregado"];

      const status =
        String(
          motoristaFlutuante["Status"] || ""
        ).toUpperCase();

      let textoStatus = "🔴 OCUPADO";

      if(status.includes("VIAGEM")){
        textoStatus = "✈️ VIAGEM";
      }

      if(status.includes("MANUT")){
        textoStatus = "🔧 MANUTENÇÃO";
      }

      linhaFlutuante = `
        <tr>
          <td><strong>${nome}</strong></td>
          <td>${textoStatus}</td>
          <td>USUÁRIO NÃO CADASTRADO</td>
        </tr>
      `;
    }

    /* ================= RESUMO (DUAL) ================= */

    const dual = document.createElement("div");
    dual.className = "dual-cards";

    [veiculosIndex, motoristasIndex].forEach(index => {

      const tab = TABS[index];
      const rows = results[index] || [];

      const section = document.createElement("section");

      section.className = "card card-resumo";

      section.innerHTML = `
        <h2>${tab.title}</h2>
        ${
          tab.id === "veiculos"
            ? renderTable(rows)
            : renderMotoristas(rows, painelRows, linhaFlutuante)
        }
      `;

      dual.appendChild(section);
    });

    app.appendChild(dual);

    /* ================= DEMAIS CARDS ================= */

    TABS.forEach((tab, index)=>{

      if(
        tab.id === "veiculos" ||
        tab.id === "motoristas"
      ) return;

      let rows;

      if(tab.id === "painel"){
        rows = painelRows;
      }
      else if(tab.id === "agenda"){
        rows = agendaRows;
      }
      else if(tab.id === "social"){
        rows = socialRows;
      }
      else{
        rows = results[index] || [];
      }

      const section = document.createElement("section");

      section.className = `card ${tab.id}`;

      section.innerHTML = `
        <h2>${tab.title}</h2>
        ${renderTable(rows)}
      `;

      app.appendChild(section);

    });

  }catch(err){

    console.error(err);

    app.innerHTML =
      "<div>Erro ao carregar dados.</div>";
  }
}

/* ================= CLOCK ================= */

setInterval(() => {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleDateString("pt-BR") +
    " — " +
    now.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });

}, 1000);

/* ================= AUDIO ================= */

const audio =
  document.getElementById("beep");

const audioBtn =
  document.getElementById("toggle-audio");

let soundEnabled = true;

function updateAudioButton(){

  audioBtn.innerText =
    soundEnabled
      ? "🔊 SOM ON"
      : "🔇 SOM OFF";

  audioBtn.classList.toggle(
    "off",
    !soundEnabled
  );
}

audioBtn.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;

    updateAudioButton();

  }
);

function playBeep(){

  if(!soundEnabled) return;

  audio.pause();
  audio.currentTime = 0;

  audio.play()
    .catch(err =>
      console.log(
        "Áudio bloqueado:",
        err
      )
    );
}

updateAudioButton();

/* ================= FULLSCREEN ================= */

function toggleFull(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>
</body>
</html>
