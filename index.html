<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>
body{
  margin:0;
  background:#071029;
  color:#fff;
  font-family:Arial;
}

header{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  background:#020617;
}

h1{margin:0;}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

main{
  padding:10px;
  display:grid;
  gap:10px;
}

.card{
  background:#0b1a3a;
  border-radius:10px;
  padding:10px;
}

  table{
  border-collapse:separate;
  border-spacing:0;
}

th,td{
  border:none;
  padding:8px;
}

tbody tr:nth-child(even){
  background:#0f2147;
}
/*
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:6px;
  border:1px solid #1e2f5c;
  text-align:center;
}
*/
thead{
  background:#2c4078;
}

.status{
  font-weight:bold;
}

.livre{color:#00ff9c;}
.ocupado{color:#ff4d4d;}
.viagem{color:#d66bff;}
.manutencao{color:#4da6ff;}

/* ================= css logo; card h1. card h2; audio ================= */

  .header-left{
display:flex;
align-items:center;
gap:15px;
}

.header-right{
display:flex;
align-items:center;
gap:10px;
}

.logo{
height:60px;
width:auto;
}

#toggle-audio.off{
background:#dc2626;
color:white;
}

#clock{
font-size:1.4rem;
font-weight:bold;
color:#ffffff;
margin-right:15px;
letter-spacing:1px;
}

.resumo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.resumo-card{
background:#0b1a3a;
border-radius:10px;
padding:10px;
}

.resumo-card h2{
margin-top:0;
}


</style>
</head>

<body>

  <audio id="beep" preload="auto"><source src="./alerta.mp3" type="audio/mpeg"></audio>

<header>
  <h1>Painel Frota</h1>

  <div>
    <span id="clock"></span>
    <button id="toggle-audio">🔊 SOM ON</button>
    <button onclick="toggleFull()">⛶</button>
  </div>
</header>

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const WEBAPP =
"https://script.google.com/macros/s/AKfycbx0XVggEh0oXHACAMDkbD2eS-hnVw_4GDOU88A7fTsWAtzSRUatK7yKSIEfz2XI40L61A/exec";

const TABS = [
  { id:"veiculos", title:"VEÍCULOS" },
  { id:"motoristas", title:"MOTORISTAS" },
  { id:"painel", title:"PAINEL" },
  { id:"agenda", title:"AGENDA" },
  { id:"social", title:"SERVIÇO SOCIAL" }
];

/* ================= FETCH ================= */

async function getData(tab){
  const res = await fetch(`${WEBAPP}?tab=${tab}`);
  return res.json();
}

/* ================= STATUS ================= */

function getStatusClass(status=""){
  status = status.toLowerCase();

  if(status.includes("viagem")) return "viagem";
  if(status.includes("manut")) return "manutencao";
  if(status.includes("ocup")) return "ocupado";

  return "livre";
}

/* ================= RENDER ================= */

function renderTable(data){

  if(!data.length) return "<p>Sem dados</p>";

  const headers = Object.keys(data[0]);

  return `
  <table>
    <thead>
      <tr>
        ${headers.map(h=>`<th>${h}</th>`).join("")}
      </tr>
    </thead>

    <tbody>
      ${data.map(row=>{

        const values = Object.values(row);

        const status =
          String(values.at(-1) || "");

        return `
          <tr>
            ${values.map((v,i)=>{

              const isLast =
                i === values.length-1;

              return `
                <td class="${isLast ? getStatusClass(status):""}">
                  ${v}
                </td>
              `;
            }).join("")}
          </tr>
        `;

      }).join("")}
    </tbody>
  </table>
  `;
}

/* ================= LOAD ================= */

async function load(){

  const app = document.getElementById("app");
  app.innerHTML = "";
  

 const resumoGrid =
document.createElement("div");

resumoGrid.className = "resumo-grid";

for(const tab of TABS.slice(0,2)){
  
const data = await getData(tab.id);

const card = document.createElement("div");

card.className = "resumo-card";

card.innerHTML = `
  <h2>${tab.title}</h2>
  ${renderTable(data.rows || [])}
`;

resumoGrid.appendChild(card);

}

app.appendChild(resumoGrid);

/* DEMAIS CARDS */
for(const tab of TABS.slice(2)){

    const data = await getData(tab.id);

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h2>${tab.title}</h2>
      ${renderTable(data.rows || [])}
    `;

    app.appendChild(card);
  }
}

/* ================= CLOCK ================= */

setInterval(() => {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleDateString("pt-BR") +
    " — " +
    now.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });

}, 1000);

/* ================= AUDIO ================= */

const audio =
  document.getElementById("beep");

const audioBtn =
  document.getElementById("toggle-audio");

let soundEnabled = true;

function updateAudioButton(){

  audioBtn.innerText =
    soundEnabled
      ? "🔊 SOM ON"
      : "🔇 SOM OFF";

  audioBtn.classList.toggle(
    "off",
    !soundEnabled
  );
}

audioBtn.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;

    updateAudioButton();

  }
);

function playBeep(){

  if(!soundEnabled) return;

  audio.pause();
  audio.currentTime = 0;

  audio.play()
    .catch(err =>
      console.log(
        "Áudio bloqueado:",
        err
      )
    );
}

updateAudioButton();

/* ================= FULLSCREEN ================= */

function toggleFull(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>
</body>
</html>
