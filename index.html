<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Frota</title>

  <link rel="stylesheet" href="css/style.css">

 </head>

<body>

  <!-- ================= AUDIO ================= -->
  <audio id="beep" preload="auto">
    <source src="alerta.mp3" type="audio/mpeg" />
  </audio>

  <!-- ================= HEADER ================= -->
  <header class="topbar">

    <div>
      <img src="logo.png" alt="Logo" class="logo">
    </div>

    <div class="center">
      <h1 class="title">MOVIMENTAÇÃO DIÁRIA</h1>
    </div>

    <div class="right">
      <div id="clock"></div>

      <div class="actions">
        <button id="toggle-audio">🔊 SOM</button>
        <button id="toggle-fullscreen">⛶ TELA</button>
      </div>
    </div>

  </header>

  <main>
  <div class="grid">

    <div class="card" id="veículos">
      <h2>Veículos</h2>
      <div class="content" id="veículosData"></div>
    </div>
    
<div class="card" id="motoristas">
      <h2>motoristas</h2>
      <div class="content" id="motoristasData"></div>
    </div>
    
    <div class="card" id="painel">
      <h2>Painel</h2>
      <div class="content" id="painelData"></div>
    </div>

    <div class="card" id="agenda">
      <h2>Agenda</h2>
      <div class="content" id="agendaData"></div>
    </div>

    <div class="card" id="social">
      <h2>Agenda Social</h2>
      <div class="content" id="socialData"></div>
    </div>

  </div>
</main>

<script src="config/config.js"></script>

<script type="module" src="js/main.js"></script>
</body>
</html>
