<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Frota</title>

  <!-- ================= ESTILO ================= -->
  <style>

  /* ================= DESIGN TOKENS ================= */
  :root {
    --bg: #071029;
    --card: #0b1a3a;
    --table: #0e224d;
    --table-alt: #0c1d40;
    --header: #2c4078;
    --border: #1e2f5c;
    --text: #ffffff;
    --muted: #9fb3ff;

    --green: #00ff9c;
    --yellow: #ffcc00;
    --red: #ff4d4d;

    --radius: 12px;
    --transition: 0.2s ease;
  }

  /* ================= RESET ================= */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= HEADER ================= */
  .topbar {
    display: grid;
    grid-template-columns: 180px 1fr 260px;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;

    background: #020617;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .logo {
    height: 60px;
    object-fit: contain;
  }

  .center {
    text-align: center;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* ================= DIREITA ================= */
  .right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  #clock {
    font-size: 18px;
    color: var(--muted);
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  button {
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
  }

  button:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }

  /* ================= MAIN ================= */
  main {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;

    overflow: auto;
  }

  /* ================= CARD ================= */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .card h2 {
    text-align: center;
    margin-bottom: 10px;
  }

  /* ================= TABLE ================= */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    background: var(--header);
  }

  th, td {
    border: 1px solid var(--border);
    padding: 8px;
    text-align: center;
  }

  tbody tr:nth-child(odd) {
    background: var(--table);
  }

  tbody tr:nth-child(even) {
    background: var(--table-alt);
  }

  .status-icon {
    font-size: 18px;
  }

  /* ================= TV MODE (FUTURO) ================= */
  @media (min-width: 1600px) {
    body {
      font-size: 18px;
    }

    .title {
      font-size: 34px;
    }

    #clock {
      font-size: 22px;
    }

    table {
      font-size: 18px;
    }
  }

  </style>
</head>

<body>

  <!-- ================= AUDIO ================= -->
  <audio id="beep" preload="auto">
    <source src="alerta.mp3" type="audio/mpeg" />
  </audio>

  <!-- ================= HEADER ================= -->
  <header class="topbar">

    <div>
      <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="center">
      <h1 class="title">MOVIMENTAÇÃO DIÁRIA</h1>
    </div>

    <div class="right">
      <div id="clock"></div>

      <div class="actions">
        <button id="toggle-audio">🔊 SOM</button>
        <button id="toggle-fullscreen">⛶ TELA</button>
      </div>
    </div>

  </header>

  <!-- ================= APP ================= -->
  <main id="app" aria-live="polite"></main>

  <!-- ================= JS ================= -->
  <script src="js/config.js" defer></script>
  <script src="js/status.js" defer></script>
  <script src="js/helpers.js" defer></script>
  <script src="js/fetch.js" defer></script>
  <script src="js/disponibilidade.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
