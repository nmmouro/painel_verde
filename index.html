<script>

/* ================= CONFIG ================= */

const WEBAPP = "https://script.google.com/macros/s/AKfycbzgAjmucod89qV3t7uIU17N7-uDsm0jBL6PNIFYQeAFWKH_njvg6lY_9jRCUnib5KHy4g/exec";

},

},
  { id:"agenda", title:"AGENDA", sheet:"AGENDA DO DIA",

},

 }

/* ================= FETCH ================= */

async function getData(tab){
  try{
    const res = await fetch(`${WEBAPP}?tab=${tab}`);
    const json = await res.json();
    return json.rows || [];
  }catch(e){
    console.error("Erro fetch:", tab, e);
    return [];
  }
}

/* ================= STATUS ================= */

const STATUS = {
  atendido:{ class:"status-atendido" },
  concluido:{ class:"status-concluido" },
  andamento:{ class:"status-andamento" },
  cancelado:{ class:"status-cancelado" },
  manutenção:{ class:"status-manutencao" },
  manutencao:{ class:"status-manutencao" },
  viagem:{ class:"status-viagem" }
};

function getStatusKey(status=""){
  status = status.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

  if(status.includes("manut")) return "manutencao";
  if(status.includes("viagem")) return "viagem";
  if(status.includes("andamento")) return "andamento";
  if(status.includes("atendido")) return "atendido";
  if(status.includes("concluido")) return "concluido";
  if(status.includes("cancelado")) return "cancelado";

  return null;
}

function getStatusClass(status){
  return STATUS[getStatusKey(status)]?.class || "";
}

/* ================= DISPONIBILIDADE ================= */

function getDisponibilidade(nome, painelRows, tipo){

  const procurado = String(nome || "").trim().toUpperCase();

  for(const row of painelRows){

    const veiculo =
      String(row["Veículo"] || "").trim().toUpperCase();

    const motorista =
      String(row["Empregado / Matrícula"] || "").trim().toUpperCase();

    const status =
      String(row["Status"] || "").trim().toUpperCase();

    const match =
      tipo === "veiculo"
        ? veiculo === procurado
        : motorista === procurado;

    if(!match) continue;

    if(status.includes("MANUT")){
      return tipo === "veiculo"
        ? '<span class="manutencao">🔧 MANUTENÇÃO</span>'
        : '<span class="livre">🟢 LIVRE</span>';
    }

    if(status.includes("VIAGEM")){
      return '<span class="viagem">✈️ VIAGEM</span>';
    }

    return '<span class="ocupado">🔴 OCUPADO</span>';
  }

  return '<span class="livre">🟢 LIVRE</span>';
}

/* ================= RENDER ================= */

  function renderTable(rows, visibleHeaders = [], tableId){

/*  if(!rows.length) return "<p>Sem dados</p>";

  const headers = visibleHeaders.length
    ? visibleHeaders
    : Object.keys(rows[0]); */

    const headers =
    visibleHeaders.length
      ? visibleHeaders
      : (rows.length
          ? Object.keys(rows[0])
          : []);

  return `
  <table class="${tableId}">
    <thead>
      <tr>
        ${headers.map(h => `<th>${h}</th>`).join("")}
      </tr>
    </thead>

    <tbody>

      ${rows.map(row => {

        const status =
          row["Status"] || "";

        return `
          <tr>

            ${headers.map(h => `

              <td class="${
                h === "Status"
                  ? getStatusClass(status)
                  : ""
              }">

                ${row[h] ?? ""}

              </td>

            `).join("")}

          </tr>
        `;

      }).join("")}

    </tbody>

  </table>`;
}
  /*

  if(!rows.length) return "<p>Sem dados</p>";

  const headers = Object.keys(rows[0]);

  return `

      ${rows.map(row => {

        const values = Object.values(row);
        const status = values.at(-1);

        return `
          <tr>

              const isLast = i === values.length - 1;

            }).join("")}

}
*/
/* ===== veículos ===== */

function renderVeiculos(rows, painelRows){

  if(!rows.length) return "<p>Sem dados</p>";

  const linhas = [...rows];

while (linhas.length < 4) {
  linhas.push({ c: [] });
}

  return `
  <table>
    <thead>
      <tr>
        <th>Placa</th>
        <th>Status</th>
        <th>Odômetro</th>
        <th>Combustível</th>
      </tr>
    </thead>
    <tbody>
      ${linhas.map(row => `
        <tr>
          <td><strong>${row["Veículo"] || ""}</strong></td>
          <td>${getDisponibilidade(row["Veículo"], painelRows, "veiculo")}</td>
          <td>${row["Km Atual"] || ""}</td>
          <td>⛽ ${row["Abastecimento"] || ""}</td>
        </tr>
      `).join("")}
    </tbody>
  </table>`;
}

/* ===== motoristas ===== */

function renderMotoristas(rows, painelRows, linhaFlutuante){

  if(!rows.length) return "<p>Sem dados</p>";

  return `
  <table>
    <thead>
      <tr>
        <th>Motorista</th>
        <th>Status</th>
        <th>Condição</th>
      </tr>
    </thead>
    <tbody>
      ${rows.map(row => `
        <tr>
          <td><strong>${row["Motorista"] || ""}</strong></td>
          <td>${getDisponibilidade(row["Motorista"], painelRows, "motorista")}</td>
          <td>${row["Condição"] || ""}</td>
        </tr>
      `).join("")}
      ${linhaFlutuante}
    </tbody>
  </table>`;
}

/* ================= LOAD ================= */

let lastHash = "";
let firstLoad = true;

async function load(){

  const app = document.getElementById("app");

  try{

    const results = await Promise.all(
      TABS.map(t => getData(t.id))
    );

    const hash = JSON.stringify(results);

    if(!firstLoad && hash !== lastHash){
      playBeep();
    }

    firstLoad = false;
    lastHash = hash;

    app.innerHTML = "";

    const hoje = new Date().toLocaleDateString("pt-BR");

    const getTab = id =>
      results[TABS.findIndex(t => t.id === id)] || [];

    const painelRows = getTab("painel")
      .filter(r => {
        const s = String(r["Status"] || "").toUpperCase();
        return s.includes("ANDAMENTO") || s.includes("VIAGEM") || s.includes("MANUT");
      });

    const agendaRows = getTab("agenda")
      .filter(r => String(r["Data"]) === hoje);

    const socialRows = getTab("social")
      .filter(r => String(r["Data"]) === hoje);

    const motoristasRows = getTab("motoristas");

    /* MOTORISTA FLUTUANTE */

    const naoCadastrado = painelRows.find(p =>
      !motoristasRows.some(m =>
        m["Motorista"] === p["Empregado / Matrícula"]
      )
    );

    let linhaFlutuante = "";

    if(naoCadastrado){
      linhaFlutuante = `
        <tr>
          <td><strong>${naoCadastrado["Empregado / Matrícula"]}</strong></td>
          <td>🔴 OCUPADO</td>
          <td>USUÁRIO NÃO CADASTRADO</td>
        </tr>`;
    }

    /* RESUMO */

    const dual = document.createElement("div");
    dual.className = "dual-cards";

    dual.innerHTML = `
      <section class="card card-resumo">
        <h2>VEÍCULOS</h2>
        ${renderVeiculos(getTab("veiculos"), painelRows)}
      </section>

      <section class="card card-resumo">
        <h2>MOTORISTAS</h2>
        ${renderMotoristas(getTab("motoristas"), painelRows, linhaFlutuante)}
      </section>
    `;

    app.appendChild(dual);

    /* DEMAIS */

    const outras = [
      { id:"painel", rows:painelRows },
      { id:"agenda", rows:agendaRows },
      { id:"social", rows:socialRows }
    ];

    outras.forEach(t => {

  const config =
    TABS.find(x => x.id === t.id);

  const section =
    document.createElement("section");

  section.className = "card";

  section.innerHTML = `
    <h2>${config.title}</h2>

    ${renderTable(
      t.rows,
      config.headers, t.id
    )}
  `;

  app.appendChild(section);

});
   /* 
    outras.forEach(t => {

      const section = document.createElement("section");
      section.className = "card";

      section.innerHTML = `
        <h2>${t.id.toUpperCase()}</h2>
        ${renderTable(t.rows)}
      `;
      
      app.appendChild(section);
    });
*/
  }catch(err){
    console.error(err);
    app.innerHTML = "<p>Erro ao carregar</p>";
  }
}



/* ================= CLOCK ================= */

setInterval(() => {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleDateString("pt-BR") +
    " — " +
    now.toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });

}, 1000);

/* ================= AUDIO ================= */

const audio =
  document.getElementById("beep");

const audioBtn =
  document.getElementById("toggle-audio");

let soundEnabled = true;

function updateAudioButton(){

  audioBtn.innerText =
    soundEnabled
      ? "🔊 SOM ON"
      : "🔇 SOM OFF";

  audioBtn.classList.toggle(
    "off",
    !soundEnabled
  );
}

audioBtn.addEventListener(
  "click",
  () => {

    soundEnabled =
      !soundEnabled;

    updateAudioButton();

  }
);

function playBeep(){

  if(!soundEnabled) return;

  audio.pause();
  audio.currentTime = 0;

  audio.play()
    .catch(err =>
      console.log(
        "Áudio bloqueado:",
        err
      )
    );
}

updateAudioButton();

/* ================= FULLSCREEN ================= */

function toggleFull(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>
