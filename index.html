<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<!-- ================= CSS ================= -->
<style>

/* ================= ROOT ================= */
:root{
  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table-alt:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;
  --text:#ffffff;
  --muted:#9fb3ff;
  --green:#00ff9c;
  --yellow:#ffcc00;
  --red:#ff4d4d;
}

/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

/* ================= HEADER ================= */
.topbar{
  display:grid;
  grid-template-columns:180px 1fr 260px;
  gap:16px;
  align-items:center;
  padding:14px 20px;
  background:#020617;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
  height:60px;
}

.center{
  text-align:center;
}

.title{
  font-size:28px;
  font-weight:700;
}

/* ================= RIGHT ================= */
.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

#clock{
  font-size:20px;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:700;
}

/* ================= MAIN ================= */
main{
  display:grid;
  gap:12px;
  padding:6px;
  height:calc(100vh - 110px);
  overflow:auto;
}

/* ================= CARD ================= */
.card{
  background:var(--card);
  border-radius:12px;
  padding:10px;
  border:1px solid rgba(255,255,255,0.05);
}

.card h2{
  text-align:center;
  margin-bottom:10px;
}

/* ================= TABLE ================= */
table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  background:var(--header);
}

td, th{
  border:1px solid var(--border);
  padding:8px;
  text-align:center;
}

tbody tr:nth-child(even){
  background:var(--table-alt);
}

tbody tr:nth-child(odd){
  background:var(--table);
}

.status-icon{
  font-size:20px;
}

</style>

</head>

<body>

<!-- ================= AUDIO ================= -->
<audio id="beep">
  <source src="alerta.mp3" type="audio/mpeg">
</audio>

<!-- ================= HEADER ================= -->
<header class="topbar">

  <div>
    <img src="logo.png" class="logo" onerror="this.style.display='none'">
  </div>

  <div class="center">
    <div class="title">MOVIMENTAÇÃO DIÁRIA</div>
  </div>

  <div class="right">
    <div id="clock"></div>

    <div class="actions">
      <button id="toggle-audio">🔊 SOM</button>
      <button id="toggle-fullscreen">⛶ TELA</button>
    </div>
  </div>

</header>

<!-- ================= APP ================= -->
<main id="app"></main>

<!-- ================= JS (ORDEM IMPORTANTE) ================= -->
<script src="js/config.js"></script>
<script src="js/status.js"></script>
<script src="js/helpers.js"></script>
<script src="js/fetch.js"></script>
<script src="js/disponibilidade.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>

</body>
</html>
