<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: bold;
    }

    .header-right {
      text-align: right;
    }

    .header-right button {
      margin-top: 5px;
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border-radius: 5px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #111827;
      color: white;
      padding-top: 80px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      background: none;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #374151;
    }

    /* CONTEÚDO */
    .content {
      flex: 1;
      margin-top: 80px;
      padding: 20px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #3b82f6;
      color: white;
    }

    .btn {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .btn-add { background: #10b981; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }

  </style>
</head>

<body>

<header>
  <div class="logo">LOGO</div>
  <div class="title">Painel de Transporte</div>

  <div class="header-right">
    <div id="datetime"></div>
    <button onclick="toggleSound()">Som ON</button>
    <button onclick="toggleFullscreen()">Tela Cheia</button>
  </div>
</header>

<aside class="sidebar">
  <button onclick="showPlanilha('p1')">PLANILHA 1</button>
  <button onclick="showPlanilha('p2')">PLANILHA 2</button>
</aside>

<main class="content">

  <!-- PLANILHA 1 -->
  <div id="planilha1">
    <h2>Planilha 1</h2>
    <button class="btn btn-add" onclick="addRowP1()">Adicionar</button>

    <table id="table1">
      <thead>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Passageiro</th>
          <th>Setor</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PLANILHA 2 -->
  <div id="planilha2" style="display:none;">
    <h2>Planilha 2</h2>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Período</th>
          <th>Passageiro</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>12/06/26</td>
          <td>Manhã</td>
          <td>João</td>
          <td>Consulta</td>
          <td>Hospital</td>
          <td>Concluído</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script>

  /* DATA E HORA */
  function updateDateTime() {
    const now = new Date();
    document.getElementById("datetime").innerText =
      now.toLocaleDateString() + " " + now.toLocaleTimeString();
  }
  setInterval(updateDateTime, 1000);

  /* TROCA PLANILHA */
  function showPlanilha(id) {
    document.getElementById('planilha1').style.display = "none";
    document.getElementById('planilha2').style.display = "none";

    if (id === 'p1') document.getElementById('planilha1').style.display = "block";
    else document.getElementById('planilha2').style.display = "block";
  }

  /* CRUD PLANILHA 1 */
  function addRowP1() {
    const table = document.querySelector("#table1 tbody");
    const row = table.insertRow();

    for (let i = 0; i < 7; i++) {
      const cell = row.insertCell(i);
      cell.contentEditable = true;
    }

    const actions = row.insertCell(7);
    actions.innerHTML = `
      <button class="btn btn-edit" onclick="editRow(this)">Salvar</button>
      <button class="btn btn-delete" onclick="deleteRow(this)">Excluir</button>
    `;
  }

  function editRow(btn) {
    const row = btn.parentElement.parentElement;
    for (let i = 0; i < 7; i++) {
      row.cells[i].contentEditable = false;
    }
  }

  function deleteRow(btn) {
    const row = btn.parentElement.parentElement;
    row.remove();
  }

  /* SOM */
  function toggleSound() {
    alert("Controle de som implementável futuramente");
  }

  /* FULLSCREEN */
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

</script>

</body>
</html>
