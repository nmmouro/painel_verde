<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: bold;
    }

    .header-right {
      text-align: right;
    }

    .header-right button {
      margin-top: 5px;
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border-radius: 5px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #111827;
      color: white;
      padding-top: 80px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      background: none;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #374151;
    }

    /* CONTEÚDO */
    .content {
      flex: 1;
      margin-top: 80px;
      padding: 20px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #3b82f6;
      color: white;
    }

    .btn {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .btn-add { background: #10b981; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }

  </style>
</head>

<body>

<header>
  <div class="logo">LOGO</div>
  <div class="title">Painel de Transporte</div>

  <div class="header-right">
    <div id="datetime"></div>
    <button onclick="toggleSound()">Som ON</button>
    <button onclick="toggleFullscreen()">Tela Cheia</button>
  </div>
</header>

<!-- SIDEBAR COM BUSCA -->
<aside class="sidebar">

  <div style="padding:10px;">
    <input type="date" id="searchDate" style="width:100%; margin-bottom:5px;">
    <select id="searchPlan" style="width:100%; margin-bottom:10px;">
      <option value="all">Todas</option>
      <option value="p1">Planilha 1</option>
      <option value="p2">Planilha 2</option>
    </select>
    <button onclick="filtrar()" style="width:100%;">Pesquisar</button>
  </div>

  <button onclick="showPlanilha('p1')">PLANILHA 1</button>
  <button onclick="showPlanilha('p2')">PLANILHA 2</button>
</aside>


<main class="content">

  <!-- PLANILHA 1 -->
  <div id="planilha1">
    <h2>Planilha 1</h2>
    <button class="btn btn-add" onclick="addRowP1()">Adicionar</button>

    <table id="table1">
      <thead>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Passageiro</th>
          <th>Setor</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PLANILHA 2 -->
  
  <div id="planilha2" style="display:none;">
    <h2>Planilha 2</h2>
    <button class="btn btn-add" onclick="addRowP2()">Adicionar</button>

    <table id="table2">
      <thead>
        <tr>
          <th>Data</th>
          <th>Período</th>
          <th>Passageiro</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>


</main>

<script>

  /* DATA E HORA */
  function updateDateTime() {
    const now = new Date();
    document.getElementById("datetime").innerText =
      now.toLocaleDateString() + " " + now.toLocaleTimeString();
  }
  setInterval(updateDateTime, 1000);

  /* TROCA PLANILHA */
  function showPlanilha(id) {
    document.getElementById('planilha1').style.display = "none";
    document.getElementById('planilha2').style.display = "none";

    if (id === 'p1') document.getElementById('planilha1').style.display = "block";
    else document.getElementById('planilha2').style.display = "block";
  }

  /* CRUD PLANILHA 1 */
  function addRowP1() {
    const table = document.querySelector("#table1 tbody");
    const row = table.insertRow();

    row.innerHTML = `
    <td><input type="date"></td>
    <td><input type="hora"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td>
      <button class="btn btn-edit" onclick="saveRowP1(this)">Salvar</button>
      <button class="btn btn-delete" onclick="deleteRow(this)">Excluir</button>
    </td>
  `;

   
    function saveRowP1(btn) {
  const row = btn.parentElement.parentElement;

  const data = row.cells[0].querySelector("input").value;
  const hora = row.cells[1].querySelector("input").value;
  
  row.cells[0].innerText = formatDate(data);
  row.cells[1].innerText = hora;
  
  for (let i = 2; i < 7; i++) {
    row.cells[i].contentEditable = false;
  }
}

    const actions = row.insertCell(7);
    actions.innerHTML = `
      <button class="btn btn-edit" onclick="editRow(this)">Salvar</button>
      <button class="btn btn-delete" onclick="deleteRow(this)">Excluir</button>
    `;
  }

  function editRowP1(btn) {
    const row = btn.parentElement.parentElement;
    for (let i = 0; i < 7; i++) {
      row.cells[i].contentEditable = false;
    }
  }

  function deleteRowP1(btn) {
    const row = btn.parentElement.parentElement;
    row.remove();
  }

  /* ============================
   PLANILHA 2 CRUD
============================ */

function addRowP2() {
  const table = document.querySelector("#table2 tbody");
  const row = table.insertRow();

  row.innerHTML = `
    <td><input type="date"></td>
    <td>
      <select>
        <option>Manhã</option>
        <option>Tarde</option>
      </select>
    </td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td>
      <button class="btn btn-edit" onclick="saveRowP2(this)">Salvar</button>
      <button class="btn btn-delete" onclick="deleteRow(this)">Excluir</button>
    </td>
  `;
}

function saveRowP2(btn) {
  const row = btn.parentElement.parentElement;

  const data = row.cells[0].querySelector("input").value;
  const periodo = row.cells[1].querySelector("select").value;

  row.cells[0].innerText = formatDate(data);
  row.cells[1].innerText = periodo;

  for (let i = 2; i < 7; i++) {
    row.cells[i].contentEditable = false;
  }
}

function formatDate(data) {
  if (!data) return "";
  const d = new Date(data);
  return d.toLocaleDateString('pt-BR');
}

/* ============================
   BUSCA / FILTRO
============================ */

function filtrar() {
  const dataBusca = document.getElementById("searchDate").value;
  const planilha = document.getElementById("searchPlan").value;

  if (planilha === "p1" || planilha === "p2") {
    showPlanilha(planilha);
  }

  if (!dataBusca) return;

  const formatted = formatDate(dataBusca);

  const tables = [];

  if (planilha === "all" || planilha === "p1") tables.push("#table1");
  if (planilha === "all" || planilha === "p2") tables.push("#table2");

  tables.forEach(id => {
    document.querySelectorAll(id + " tbody tr").forEach(row => {
      const cellDate = row.cells[0].innerText;
      row.style.display = (cellDate === formatted) ? "" : "none";
    });
  });
}


  /* SOM */
  function toggleSound() {
    alert("Controle de som implementável futuramente");
  }

  /* FULLSCREEN */
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

</script>

</body>
</html>
