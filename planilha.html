<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: bold;
    }

    .header-right {
      text-align: right;
    }

    .header-right button {
      margin-top: 5px;
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border-radius: 5px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #111827;
      color: white;
      padding-top: 80px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      background: none;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #374151;
    }

    .editing {
  background: #fff3cd;
}

button {
  cursor: pointer;
}

    /* CONTEÚDO */
    .content {
      flex: 1;
      margin-top: 80px;
      padding: 20px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #3b82f6;
      color: white;
    }

    .btn {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .btn-add { background: #10b981; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }

  </style>
</head>

<body>

<header>
  <div class="logo">LOGO</div>
  <div class="title">Painel de Transporte</div>

  <div class="header-right">
    <div id="datetime"></div>
    <button onclick="toggleSound()">Som ON</button>
    <button onclick="toggleFullscreen()">Tela Cheia</button>
  </div>
</header>

<!-- SIDEBAR COM BUSCA -->
<aside class="sidebar">

  <div style="padding:10px;">
    <input type="date" id="searchDate" style="width:100%; margin-bottom:5px;">
    <select id="searchPlan" style="width:100%; margin-bottom:10px;">
      <option value="all">Todas</option>
      <option value="p1">Planilha 1</option>
      <option value="p2">Planilha 2</option>
    </select>
    <button onclick="filtrar()" style="width:100%;">Pesquisar</button>
  </div>

  <button onclick="showPlanilha('p1')">PLANILHA 1</button>
  <button onclick="showPlanilha('p2')">PLANILHA 2</button>
</aside>


<main class="content">

  <!-- PLANILHA 1 -->
  <div id="planilha1">
    <h2>Planilha 1</h2>
    <button class="btn btn-add" onclick="addRow('Planilha1')">➕ Adicionar</button>

    <table id="table1">
      <thead>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Passageiro</th>
          <th>Setor</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PLANILHA 2 -->
  
  <div id="planilha2" style="display:none;">
    <h2>Planilha 2</h2>
    <button class="btn btn-add" onclick="addRow('Planilha2')">➕ Adicionar</button>

    <table id="table2">
      <thead>
        <tr>
          <th>Data</th>
          <th>Período</th>
          <th>Passageiro</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>


</main>

<script>


const API_URL = "https://script.google.com/macros/s/AKfycbz67LG_8h-EWJs6t132FnT5ask5dE12nFiZECdxEjYig21-hH_L5tXTB_uX1o4WeOjgFw/exec";

/* ============================
   HEADER
============================ */
function updateDateTime() {
  const now = new Date();
  document.getElementById("datetime").innerText =
    now.toLocaleDateString() + " " + now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);

/* ============================
   TROCA DE PLANILHA
============================ */
function showPlanilha(id) {
  planilha1.style.display = "none";
  planilha2.style.display = "none";

  document.getElementById(id === "p1" ? "planilha1" : "planilha2").style.display = "block";
}

/* ============================
   CARREGAR DADOS
============================ */
function carregarPlanilha(planilha) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "read", planilha })
  })
  .then(res => res.json())
  .then(res => {
    if (!res.success) return;

    if (planilha === "Planilha1") renderTable1(res.data);
    if (planilha === "Planilha2") renderTable2(res.data);
  })
  .catch(err => console.error(err));
}

/* ============================
   RENDER TABLE 1
============================ */
function renderTable1(data) {
  const tbody = document.querySelector("#table1 tbody");
  tbody.innerHTML = "";

  data.slice(1).forEach(row => {
    const tr = document.createElement("tr");
    tr.dataset.id = row[0];

    tr.innerHTML = `
      <td onclick="editCell(this,'date','Planilha1')">${row[1]}</td>
      <td onclick="editCell(this,'time','Planilha1')">${row[2]}</td>
      <td onclick="editCell(this,'text','Planilha1')">${row[3]}</td>
      <td onclick="editCell(this,'text','Planilha1')">${row[4]}</td>
      <td onclick="editCell(this,'text','Planilha1')">${row[5]}</td>
      <td onclick="editCell(this,'text','Planilha1')">${row[6]}</td>
      <td onclick="editCell(this,'text','Planilha1')">${row[7]}</td>
      <td><button onclick="deleteRow(this,'Planilha1')">🗑</button></td>

    `;

    tbody.appendChild(tr);
  });
}

/* ============================
   RENDER TABLE 2
============================ */
function renderTable2(data) {
  const tbody = document.querySelector("#table2 tbody");
  tbody.innerHTML = "";

  data.slice(1).forEach(row => {
    const tr = document.createElement("tr");
    tr.dataset.id = row[0];

    tr.innerHTML = `
      <td onclick="editCell(this,'date','Planilha2')">${row[1]}</td>
      <td onclick="editCell(this,'select','Planilha2')">${row[2]}</td>
      <td onclick="editCell(this,'text','Planilha2')">${row[3]}</td>
      <td onclick="editCell(this,'text','Planilha2')">${row[4]}</td>
      <td onclick="editCell(this,'text','Planilha2')">${row[5]}</td>
      <td onclick="editCell(this,'text','Planilha2')">${row[6]}</td>
      <td><button onclick="deleteRow(this,'Planilha2')">🗑</button></td>

    `;

    tbody.appendChild(tr);
  });
}

function addRow(planilha) {
  const tableId = planilha === "Planilha1" ? "#table1 tbody" : "#table2 tbody";
  const row = document.querySelector(tableId).insertRow();

  if (planilha === "Planilha1") {
    row.innerHTML = `
      <td><input type="date"></td>
      <td><input type="time"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td>
        <button onclick="createRow(this,'Planilha1')">Salvar</button>
        <button onclick="deleteRow(this)">Cancelar</button>
      </td>
    `;
  } else {
    row.innerHTML = `
      <td><input type="date"></td>
      <td>
        <select>
          <option value="">Selecione</option>
          <option>Manhã</option>
          <option>Tarde</option>
        </select>
      </td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td>
        <button onclick="createRow(this,'Planilha2')">Salvar</button>
        <button onclick="deleteRow(this)">Cancelar</button>
      </td>
    `;
  }

  // foco automático
  setTimeout(() => {
    row.querySelector("input")?.focus();
  }, 100);
}
  

/* ============================
   INLINE EDIT
============================ */
function editCell(td, tipo, planilha) {
  if (td.querySelector("input") || td.querySelector("select")) return;

  const valor = td.innerText;

  if (tipo === "date") {
    td.innerHTML = `<input type="date" value="${toISO(valor)}">`;
  } else if (tipo === "time") {
    td.innerHTML = `<input type="time" value="${valor}">`;
  } else if (tipo === "select") {
    td.innerHTML = `
      <select>
        <option ${valor === "Manhã" ? "selected" : ""}>Manhã</option>
        <option ${valor === "Tarde" ? "selected" : ""}>Tarde</option>
      </select>
    `;
  } else {
    td.innerHTML = `<input value="${valor}">`;
  }

  const input = td.querySelector("input, select");
  input.focus();

  input.addEventListener("blur", () => saveRow(td.closest("tr"), planilha));
}

/* ============================
   SALVAR AUTOMÁTICO
============================ */
function saveRow(row, planilha) {
  const id = row.dataset.id;
  let valores;

  if (planilha === "Planilha1") {
    const campos = [...row.querySelectorAll("input")];

    valores = [
      formatDate(campos[0].value),
      campos[1].value,
      campos[2]?.value,
      campos[3]?.value,
      campos[4]?.value,
      campos[5]?.value,
      campos[6]?.value
    ];
  } else {
    const campos = [...row.querySelectorAll("input, select")];

    valores = [
      formatDate(campos[0].value),
      campos[1].value,
      campos[2]?.value,
      campos[3]?.value,
      campos[4]?.value,
      campos[5]?.value
    ];
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "update",
      planilha,
      id,
      valores
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) carregarPlanilha(planilha);
    else alert("Erro ao salvar");
  });
}

/* ============================
   CREATE
============================ */
function createRow(btn, planilha) {
  const row = btn.closest("tr");

  let valores;

  if (planilha === "Planilha1") {
    const data = row.cells[0].querySelector("input").value;
    const hora = row.cells[1].querySelector("input").value;

    valores = [
      formatDate(data),
      hora,
      row.cells[2].innerText.trim(),
      row.cells[3].innerText.trim(),
      row.cells[4].innerText.trim(),
      row.cells[5].innerText.trim(),
      row.cells[6].innerText.trim()
    ];
  } else {
    const data = row.cells[0].querySelector("input").value;
    const periodo = row.cells[1].querySelector("select").value;

    valores = [
      formatDate(data),
      periodo,
      row.cells[2].innerText.trim(),
      row.cells[3].innerText.trim(),
      row.cells[4].innerText.trim(),
      row.cells[5].innerText.trim()
    ];
  }

  if (!valores[0]) {
    alert("Data obrigatória");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "create",
      planilha,
      valores
    })
  })
  .then(res => res.json())
  .then(res => {
    console.log("Resposta API:", res);

    if (res.success) {
      carregarPlanilha(planilha);
    } else {
      alert("Erro ao salvar");
    }
  })
  .catch(err => {
    console.error("Erro:", err);
    alert("Erro na comunicação com API");
  });
}

/* ============================
   DELETE
============================ */
function deleteRow(btn, planilha) {
  const row = btn.closest("tr");

  if (!row.dataset.id) {
    row.remove();
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      planilha,
      id: row.dataset.id
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) row.remove();
    else alert("Erro ao excluir");
  });
}

/* ============================
   UTIL
============================ */
function formatDate(data) {
  if (!data) return "";
  const [ano, mes, dia] = data.split("-");
  return `${dia}/${mes}/${ano}`;
}

function toISO(data) {
  if (!data) return "";
  const [dia, mes, ano] = data.split("/");
  return `${ano}-${mes}-${dia}`;
}

/* ============================
   INIT
============================ */
window.onload = () => {
  carregarPlanilha("Planilha1");
  carregarPlanilha("Planilha2");
};
  
</script>

 

</body>
</html>
