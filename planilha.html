<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: bold;
    }

    .header-right {
      text-align: right;
    }

    .header-right button {
      margin-top: 5px;
      margin-left: 5px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border-radius: 5px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #111827;
      color: white;
      padding-top: 80px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      background: none;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #374151;
    }

    .editing {
  background: #fff3cd;
}

button {
  cursor: pointer;
}

    /* CONTEÚDO */
    .content {
      flex: 1;
      margin-top: 80px;
      padding: 20px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #3b82f6;
      color: white;
    }

    .btn {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .btn-add { background: #10b981; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }

  </style>
</head>

<body>

<header>
  <div class="logo">LOGO</div>
  <div class="title">Painel de Transporte</div>

  <div class="header-right">
    <div id="datetime"></div>
    <button onclick="toggleSound()">Som ON</button>
    <button onclick="toggleFullscreen()">Tela Cheia</button>
  </div>
</header>

<!-- SIDEBAR COM BUSCA -->
<aside class="sidebar">

  <div style="padding:10px;">
    <input type="date" id="searchDate" style="width:100%; margin-bottom:5px;">
    <select id="searchPlan" style="width:100%; margin-bottom:10px;">
      <option value="all">Todas</option>
      <option value="p1">Planilha 1</option>
      <option value="p2">Planilha 2</option>
    </select>
    <button onclick="filtrar()" style="width:100%;">Pesquisar</button>
  </div>

  <button onclick="showPlanilha('p1')">PLANILHA 1</button>
  <button onclick="showPlanilha('p2')">PLANILHA 2</button>
</aside>


<main class="content">

  <!-- PLANILHA 1 -->
  <div id="planilha1">
    <h2>Planilha 1</h2>
    <button class="btn btn-add" onclick="addRowP1()">Adicionar</button>

    <table id="table1">
      <thead>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Passageiro</th>
          <th>Setor</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PLANILHA 2 -->
  
  <div id="planilha2" style="display:none;">
    <h2>Planilha 2</h2>
    <button class="btn btn-add" onclick="addRowP2()">Adicionar</button>

    <table id="table2">
      <thead>
        <tr>
          <th>Data</th>
          <th>Período</th>
          <th>Passageiro</th>
          <th>Motivo</th>
          <th>Itinerário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>


</main>

<script>


const API_URL = "https://script.google.com/macros/s/AKfycbz67LG_8h-EWJs6t132FnT5ask5dE12nFiZECdxEjYig21-hH_L5tXTB_uX1o4WeOjgFw/exec";


/* ============================
   CARREGAR DADOS
============================ */

function carregarPlanilha(planilha) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "read",
      planilha: planilha
    })
  })
  .then(res => res.json())
  .then(res => {
    if (planilha === "Planilha1") {
      renderTable1(res.data);
    }
  });
}

/* ============================
   RENDER TABELA
============================ */

function renderTable1(dados) {
  const tbody = document.querySelector("#table1 tbody");
  tbody.innerHTML = "";

  dados.slice(1).forEach(row => {
    const tr = document.createElement("tr");
    tr.dataset.id = row[0];

    tr.innerHTML = `
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>${row[3]}</td>
      <td>${row[4]}</td>
      <td>${row[5]}</td>
      <td>${row[6]}</td>
      <td>${row[7]}</td>
      <td>
        <button onclick="editInline(this)">✏️</button>
        <button onclick="saveInline(this)">💾</button>
        <button onclick="deleteInline(this)">🗑</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* ============================
   EDITAR INLINE
============================ */

function editInline(btn) {
  const row = btn.parentElement.parentElement;
  row.classList.add("editing");

  row.cells[0].innerHTML = `<input type="date" value="${toISO(row.cells[0].innerText)}">`;
  row.cells[1].innerHTML = `<input type="time" value="${row.cells[1].innerText}">`;

  for (let i = 2; i <= 6; i++) {
    const val = row.cells[i].innerText;
    row.cells[i].innerHTML = `<input value="${val}">`;
  }
}

/* ============================
   SALVAR INLINE (UPDATE)
============================ */

function saveInline(btn) {
  const row = btn.parentElement.parentElement;
  const id = row.dataset.id;

  const data = row.cells[0].querySelector("input").value;
  const hora = row.cells[1].querySelector("input").value;

  const valores = [
    formatDate(data),
    hora,
    row.cells[2].querySelector("input").value,
    row.cells[3].querySelector("input").value,
    row.cells[4].querySelector("input").value,
    row.cells[5].querySelector("input").value,
    row.cells[6].querySelector("input").value
  ];

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "update",
      planilha: "Planilha1",
      id: id,
      valores: valores
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      carregarPlanilha("Planilha1");
    } else {
      alert("Erro ao atualizar");
    }
  });
}

/* ============================
   EXCLUIR INLINE
============================ */

function deleteInline(btn) {
  const row = btn.parentElement.parentElement;
  const id = row.dataset.id;

  if (!confirm("Deseja excluir este registro?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      planilha: "Planilha1",
      id: id
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      row.remove();
    } else {
      alert("Erro ao excluir");
    }
  });
}

/* ============================
   FORMATAÇÃO DATA
============================ */

function formatDate(data) {
  const [ano, mes, dia] = data.split("-");
  return `${dia}/${mes}/${ano}`;
}

function toISO(dataBR) {
  const [dia, mes, ano] = dataBR.split("/");
  return `${ano}-${mes}-${dia}`;
}



  

  

/* ============================
   DATA E HORA HEADER
============================ */

function updateDateTime() {
  const now = new Date();
  document.getElementById("datetime").innerText =
    now.toLocaleDateString() + " " + now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);


/* ============================
   TROCA DE PLANILHA
============================ */

function showPlanilha(id) {
  document.getElementById('planilha1').style.display = "none";
  document.getElementById('planilha2').style.display = "none";

  document.getElementById(id === 'p1' ? 'planilha1' : 'planilha2').style.display = "block";
}


/* ============================
   PLANILHA 1 (CRUD)
============================ */

function addRowP1() {
  const table = document.querySelector("#table1 tbody");
  const row = table.insertRow();

  row.classList.add("editing");

  row.innerHTML = `
    <td><input type="date"></td>
    <td><input type="time"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td>
      <button class="btn btn-add" onclick="createRowP1(this)">💾 Salvar</button>
      <button class="btn btn-delete" onclick="cancelRow(this)">✖ Cancelar</button>
    </td>
  `;
  
  // foco automático no primeiro campo
  setTimeout(() => {
    row.cells[0].querySelector("input").focus();
  }, 100);
} 
}
  
  function carregarPlanilha(planilha) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "read",
      planilha: planilha
    })
  })
  .then(res => res.json())
  .then(res => {
    console.log(res.data);
    // montar tabela aqui
  });
}

function createRowP1(btn) {
  const row = btn.parentElement.parentElement;

  const dataInput = row.cells[0].querySelector("input");
  const horaInput = row.cells[1].querySelector("input");

  const passageiro = row.cells[2].innerText;
  const setor = row.cells[3].innerText;
  const motivo = row.cells[4].innerText;
  const itinerario = row.cells[5].innerText;
  const status = row.cells[6].innerText;

  const data = dataInput.value;
  const hora = horaInput.value;

  /* ============================
     VALIDAÇÃO
  ============================ */

  if (!validarCampo(data, "Data")) {
    destacarErro(dataInput);
    return;
  }

  if (!validarCampo(hora, "Hora")) {
    destacarErro(horaInput);
    return;
  }

  if (!validarCampo(passageiro, "Passageiro")) {
    destacarErro(row.cells[2]);
    return;
  }

  if (!validarCampo(setor, "Setor")) {
    destacarErro(row.cells[3]);
    return;
  }

  if (!validarCampo(status, "Status")) {
    destacarErro(row.cells[6]);
    return;
  }

  /* ============================
     LIMPAR ERROS
  ============================ */

  limparErro(dataInput);
  limparErro(horaInput);

  for (let i = 2; i <= 6; i++) {
    limparErro(row.cells[i]);
  }

  /* ============================
     ENVIO PARA GOOGLE SHEETS
  ============================ */

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "create",
      planilha: "Planilha1",
      valores: [
        formatDate(data),
        hora,
        passageiro,
        setor,
        motivo,
        itinerario,
        status
      ]
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      // feedback leve (evita alert pesado)
      console.log("✅ Registro criado com sucesso");

      // recarrega tabela sincronizada
      carregarPlanilha("Planilha1");
    } else {
      alert("❌ Erro ao salvar no Google Sheets");
    }
  })
  .catch(err => {
    console.error(err);
    alert("Erro de conexão com API");
  });
}
  

function saveRowP1(btn) {
  const row = btn.parentElement.parentElement;

  const dataInput = row.cells[0].querySelector("input");
  const horaInput = row.cells[1].querySelector("input");

  const passageiro = row.cells[2].innerText;
  const setor = row.cells[3].innerText;
  const motivo = row.cells[4].innerText;
  const itinerario = row.cells[5].innerText;
  const status = row.cells[6].innerText;

  const data = dataInput.value;
  const hora = horaInput.value;

  /* ============================
     VALIDAÇÃO
  ============================ */

  if (!validarCampo(data, "Data")) return;
  if (!validarCampo(hora, "Hora")) return;
  if (!validarCampo(passageiro, "Passageiro")) return;

  /* ============================
     ENVIO PARA GOOGLE SHEETS
  ============================ */

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "create",
      planilha: "Planilha1",
      valores: [
        formatDate(data),
        hora,
        passageiro,
        setor,
        motivo,
        itinerario,
        status
      ]
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      alert("✅ Registro salvo!");

      // recarrega tabela sincronizada
      carregarPlanilha("Planilha1");
    } else {
      alert("❌ Erro ao salvar");
    }
  });
}

/* ============================
   envio para Google Sheets
============================ */

fetch(API_URL, {
  method: "POST",
  body: JSON.stringify({
    planilha: "Planilha1",
    valores: [
      formatDate(data),
      hora,
      passageiro.innerText,
      setor.innerText,
      motivo.innerText,
      itinerario.innerText,
      status.innerText
    ]
  })
})
.then(res => res.json())
.then(res => {
  if (!res.success) alert("Erro ao salvar");
});
  

function editRowP1(btn) {
  const row = btn.parentElement.parentElement;

  for (let i = 2; i <= 6; i++) {
    row.cells[i].contentEditable = true;
  }
}


/* ============================
   PLANILHA 2 (CRUD)
============================ */

function addRowP2() {
  const table = document.querySelector("#table2 tbody");
  const row = table.insertRow();

  row.classList.add("editing");

  row.innerHTML = `
    <td><input type="date"></td>
    <td>
      <select>
        <option value="">Selecione</option>
        <option>Manhã</option>
        <option>Tarde</option>
      </select>
    </td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td>
      <button class="btn btn-add" onclick="createRowP2(this)">💾 Salvar</button>
      <button class="btn btn-delete" onclick="cancelRow(this)">✖ Cancelar</button>
    </td>
  `;

  // foco automático no primeiro campo
  setTimeout(() => {
    row.cells[0].querySelector("input").focus();
  }, 100);
} 

function createRowP2(btn) {
  const row = btn.parentElement.parentElement;

  const dataInput = row.cells[0].querySelector("input");
  const periodoSelect = row.cells[1].querySelector("select");

  const passageiro = row.cells[2].innerText;
  const motivo = row.cells[3].innerText;
  const itinerario = row.cells[4].innerText;
  const status = row.cells[5].innerText;

  const data = dataInput.value;
  const periodo = periodoSelect.value;

  /* VALIDAÇÃO */
  if (!validarCampo(data, "Data")) return;
  if (!validarCampo(periodo, "Período")) return;
  if (!validarCampo(passageiro, "Passageiro")) return;

  /* ENVIO */
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "create",
      planilha: "Planilha2",
      valores: [
        formatDate(data),
        periodo,
        passageiro,
        motivo,
        itinerario,
        status
      ]
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      alert("✅ Registro criado!");
      carregarPlanilha("Planilha2");
    } else {
      alert("❌ Erro ao salvar");
    }
  });
}

function saveRowP2(btn) {
  const row = btn.parentElement.parentElement;

  const dataInput = row.cells[0].querySelector("input");
  const periodoSelect = row.cells[1].querySelector("select");

  const passageiro = row.cells[2].innerText;
  const motivo = row.cells[3].innerText;
  const itinerario = row.cells[4].innerText;
  const status = row.cells[5].innerText;

  const data = dataInput.value;
  const periodo = periodoSelect.value;

  /* ============================
     VALIDAÇÃO
  ============================ */

  if (!validarCampo(data, "Data")) {
    destacarErro(dataInput);
    return;
  }

  if (!validarCampo(periodo, "Período")) {
    destacarErro(periodoSelect);
    return;
  }

  if (!validarCampo(passageiro, "Passageiro")) {
    destacarErro(row.cells[2]);
    return;
  }

  /* ============================
     LIMPAR ERROS
  ============================ */

  limparErro(dataInput);
  limparErro(periodoSelect);

  /* ============================
     ENVIO PARA GOOGLE SHEETS
  ============================ */

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "create",
      planilha: "Planilha2",
      valores: [
        formatDate(data),
        periodo,
        passageiro,
        motivo,
        itinerario,
        status
      ]
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.success) {
      alert("✅ Registro salvo!");

      // Atualiza tabela
      carregarPlanilha("Planilha2");
    } else {
      alert("❌ Erro ao salvar");
    }
  });

  /* ============================
     ATUALIZA UI (opcional)
  ============================ */

  row.cells[0].innerText = formatDate(data);
  row.cells[1].innerText = periodo;

  for (let i = 2; i <= 5; i++) {
    row.cells[i].contentEditable = false;
    limparErro(row.cells[i]);
  }
}

  /* ============================
   envio para Google Sheets
============================ */



/* ============================
   FUNÇÕES GERAIS
============================ */

function deleteRow(btn) {
  const row = btn.parentElement.parentElement;
  row.remove();
}

function parseLocalDate(data) {
  const [ano, mes, dia] = data.split("-");
  return new Date(ano, mes - 1, dia); // LOCAL (sem UTC bug)
}


/* ============================
   FILTRO
============================ */

function filtrar() {
  const dataBusca = document.getElementById("searchDate").value;
  const planilha = document.getElementById("searchPlan").value;

  if (planilha === "p1" || planilha === "p2") {
    showPlanilha(planilha);
  }

  if (!dataBusca) return;

  const formatted = formatDate(dataBusca);

  const tables = [];

  if (planilha === "all" || planilha === "p1") tables.push("#table1");
  if (planilha === "all" || planilha === "p2") tables.push("#table2");

  tables.forEach(id => {
    document.querySelectorAll(id + " tbody tr").forEach(row => {
      const cellDate = row.cells[0].innerText;
      row.style.display = (cellDate === formatted) ? "" : "none";
    });
  });
}

  /* ============================
   VALIDAÇÃO DE DADOS
============================ */

  function validarCampo(campo, nome) {
  if (!campo || campo.trim() === "") {
    alert("Campo obrigatório: " + nome);
    return false;
  }
  return true;
}

function destacarErro(element) {
  element.style.border = "2px solid red";
}

function limparErro(element) {
  element.style.border = "";
}


/* ============================
   SOM + FULLSCREEN
============================ */

function toggleSound() {
  alert("Controle de som implementável futuramente");
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

   window.onload = () => {
  carregarPlanilha("Planilha1");
};
</script>

 

</body>
</html>
